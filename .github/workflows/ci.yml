name: Student Management CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - main
jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check application files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Run automated tests
        run: node --test

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
        
      - name: Build Docker image
        run: |
          docker build \
            -t student-management:latest \
            -t student-management:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: docker tag student-management:latest renunallapu/student-management:latest
              docker tag student-management:${{ github.sha }} renunallapu/student-management:${{ github.sha }}

      - name: Push Docker Image
        run: docker push renunallapu/student-management:latest
             docker push renunallapu/student-management:${{ github.sha }}
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
    steps:
      - name: Connect to Production EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/production-key.pem
          chmod 400 ~/.ssh/production-key.pem
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy Application to Production
        run: |
          ssh -i ~/.ssh/production-key.pem \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "sudo docker pull renunallapu/student-management:${{ github.sha }} &&
             (sudo docker stop student-management-prod || true) &&
             (sudo docker rm student-management-prod || true) &&
             sudo docker run -d \
               --name student-management-prod \
               --restart unless-stopped \
               -p 80:8080 \
               renunallapu/student-management:${{ github.sha }}"
